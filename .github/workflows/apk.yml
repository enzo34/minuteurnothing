name: APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest

    steps:
      # Uniquement des actions publiees par GitHub : les depots qui restreignent
      # les actions tierces refusent sinon de demarrer le job, sans aucun journal.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      # Le SDK Android est preinstalle sur l image ubuntu-latest.
      - name: Reperer le SDK Android
        run: |
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compiler l APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Preparer le fichier
        run: |
          mkdir -p sortie
          cp app/build/outputs/apk/release/app-release.apk sortie/cachet45.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cachet45-apk
          path: sortie/cachet45.apk
          if-no-files-found: error

      - name: Publier la version telechargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "APK construit le $(date -u '+%d/%m/%Y %H:%M UTC') depuis la branche ${{ github.ref_name }}." \
            "" \
            "Telechargez cachet45.apk depuis le telephone puis ouvrez le fichier pour installer." \
            > notes.md
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version sortie/cachet45.apk \
            --title "Cachet 45 - derniere version" \
            --notes-file notes.md \
            --prerelease
